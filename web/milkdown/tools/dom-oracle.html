<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>Milkdown 脏区渲染判据</title>
<style>
  body { font: 14px/1.6 system-ui, sans-serif; margin: 24px; color: #17202a; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.hint { color: #5b6b7b; margin: 0 0 16px; max-width: 900px; }
  table { border-collapse: collapse; width: 100%; margin: 8px 0 18px; }
  th, td { border: 1px solid #d5dde5; padding: 5px 9px; text-align: left; font-variant-numeric: tabular-nums; }
  th { background: #f2f5f8; }
  .pass { color: #14612e; font-weight: 600; }
  .fail { color: #96141a; font-weight: 600; }
  pre { background: #f7f9fb; border: 1px solid #e2e8ee; padding: 10px; overflow: auto; font-size: 12px; }
  iframe { width: 900px; height: 320px; border: 1px solid #d5dde5; }
  #status { font-weight: 600; }
</style>
</head>
<body>
<h1>脏区驱动 DOM 收尾 —— 与全量收尾的一致性判据</h1>
<p class="hint">
  <code>syncRenderedDom</code> 现在每次收尾都遍历整棵 DOM。Phase 3 想改成「只处理本轮被改动的块」。
  本页面把同一串编辑操作分别喂给两种实现：每步之后，让「增量路径」跑一次、再让「全量路径」跑一次，
  比对两者留下的 DOM 指纹（标签 + 属性 + 关键计算样式）。任何一步不一致，增量实现就不能上线。
  编辑序列刻意覆盖已知风险面：标题增删（影响其后所有标题的行号）、任务项增删（影响 checkbox 序号）、
  代码块语言（影响围栏语言配对）、图片、表格、HTML 块、撤销。
</p>
<p id="status">准备中…</p>
<div id="results"></div>
<iframe id="editor" src="/dist/index.html" title="被测编辑器"></iframe>

<script type="module">
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');
const frame = document.getElementById('editor');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

/** DOM 指纹：标签 + 全部属性（排除易变的 src/href/value/style）+ 关键计算样式 */
function fingerprint(root) {
  if (!root) return 'NO_ROOT';
  const parts = [];
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT);
  let n = 0;
  while (walker.nextNode() && n < 80000) {
    n += 1;
    const el = walker.currentNode;
    const cs = getComputedStyle(el);
    const attrs = [];
    for (const a of el.attributes) {
      if (a.name === 'src' || a.name === 'href' || a.name === 'value' || a.name === 'placeholder' || a.name === 'style') continue;
      attrs.push(`${a.name}=${a.value}`);
    }
    attrs.sort();
    parts.push(`${el.tagName}|${attrs.join(';')}|${cs.display};${cs.position};${cs.visibility};${cs.opacity};${cs.pointerEvents};${cs.paddingTop}`);
  }
  return parts.join('\n');
}

function firstDiff(a, b) {
  const la = a.split('\n');
  const lb = b.split('\n');
  const n = Math.min(la.length, lb.length);
  for (let i = 0; i < n; i++) if (la[i] !== lb[i]) return { i, A: la[i], B: lb[i], la: la.length, lb: lb.length };
  if (la.length !== lb.length) return { i: n, A: '(长度不同)', B: '(长度不同)', la: la.length, lb: lb.length };
  return null;
}

async function boot() {
  for (let k = 0; k < 400; k++) {
    const bridge = frame.contentWindow.__USHIO_BRIDGE__;
    if (bridge?.onFlutterMessage) {
      const seed = [
        '# 判据文档', '',
        '## 第一节', '', '正文一 [链](https://example.com/1) 与 `码`。', '',
        '```js', 'const a = 1;', '```', '',
        '- [ ] 任务一', '- [x] 完成一', '',
        '![图一](pic1.png)', '',
        '| A | B |', '| --- | --- |', '| 1 | 2 |', '',
        '<div class="note">', '<p>提示</p>', '</div>', '',
        '## 第二节', '', '正文二。', '',
        '## 第三节', '', '正文三。', '',
      ].join('\n');
      bridge.onFlutterMessage({
        v: 1, source: 'flutter', target: 'web', type: 'init_doc',
        payload: { markdown: seed, readOnly: false, baseDirectory: '' },
      });
      for (let j = 0; j < 400; j++) {
        if (frame.contentWindow.__USHIO_PERF__?.serialize?.()) return true;
        await wait(100);
      }
    }
    await wait(100);
  }
  return false;
}

/**
 * 编辑动作：全部通过真实 DOM/ProseMirror 路径触发，不直接改 DOM。
 * 每个动作返回一句人话描述，用于报告。
 */
const edits = [
  { name: '在第一节正文末尾打字', run: (win) => typeAtEndOfParagraph(win, '正文一', '追加文字') },
  { name: '在文档末尾新增一个二级标题', run: (win) => appendMarkdown(win, '## 新节\n\n新节正文。\n') },
  { name: '删除第一个标题（其后所有标题行号都要变）', run: (win) => deleteNthHeading(win, 1) },
  { name: '插入一个新任务项（其后 checkbox 序号都要变）', run: (win) => appendMarkdown(win, '- [ ] 新任务\n\n') },
  { name: '插入一个带语言的代码块', run: (win) => appendMarkdown(win, '```python\nprint(1)\n```\n\n') },
  { name: '插入一张图片', run: (win) => appendMarkdown(win, '![新图](pic9.png)\n\n') },
  { name: '插入一个 HTML 块', run: (win) => appendMarkdown(win, '<section>\n<p>块</p>\n</section>\n\n') },
  { name: '连续撤销 4 步', run: (win) => { for (let i = 0; i < 4; i++) win.__USHIO_PERF__.execCmd('undo'); } },
  { name: '重做 2 步', run: (win) => { for (let i = 0; i < 2; i++) win.__USHIO_PERF__.execCmd('redo'); } },
];

function pm(win) { return win.document.querySelector('.ProseMirror'); }
function selectEnd(win, el) {
  const doc = win.document;
  const sel = win.getSelection();
  const range = doc.createRange();
  range.selectNodeContents(el);
  range.collapse(false);
  sel.removeAllRanges();
  sel.addRange(range);
}
function typeAtEndOfParagraph(win, needle, text) {
  const el = Array.from(pm(win).querySelectorAll('p')).find((p) => (p.textContent || '').includes(needle));
  if (!el) return '未找到目标段落（跳过）';
  selectEnd(win, el);
  win.document.execCommand('insertText', false, text);
  return `在“${needle}”后插入 ${text.length} 字`;
}
function appendMarkdown(win, md) {
  // 通过编辑器自身的粘贴/输入通道追加，而不是直接改 doc
  const view = win.__USHIO_PERF__;
  view.appendRaw?.(md);
  return `追加 ${md.length} 字符`;
}
function deleteNthHeading(win, n) {
  const hs = pm(win).querySelectorAll('h1,h2,h3,h4,h5,h6');
  const el = hs[n];
  if (!el) return '无足够标题（跳过）';
  const doc = win.document;
  const range = doc.createRange();
  range.selectNodeContents(el);
  const sel = win.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  win.document.execCommand('delete');
  return `删除第 ${n + 1} 个标题`;
}

function sample(win) {
  const root = win.document.querySelector('.milkdown');
  return { fp: fingerprint(root), blocks: pm(win)?.childElementCount ?? -1 };
}

(async () => {
  statusEl.textContent = '等待编辑器就绪…';
  if (!(await boot())) { statusEl.textContent = '编辑器未能就绪，判据未执行'; return; }
  const win = frame.contentWindow;
  const perf = win.__USHIO_PERF__;
  if (!perf.setIncrementalDom) {
    statusEl.innerHTML = '<span class="fail">增量模式尚未实现（缺 setIncrementalDom），判据先立在这里</span>';
    resultsEl.innerHTML = '<p>本页面是 Phase 3 的准入门禁：实现脏区驱动后必须让下面每一步都「一致」才能上线。</p>';
    return;
  }
  const rows = [];
  for (const edit of edits) {
    // 先跑全量作为参照，再跑增量，比对指纹
    perf.setIncrementalDom(false);
    edit.run(win);
    perf.sync();
    const full = sample(win);
    perf.setIncrementalDom(true);
    perf.sync();
    const inc = sample(win);
    const diff = firstDiff(full.fp, inc.fp);
    rows.push({ name: edit.name, ok: !diff, fullBlocks: full.blocks, incBlocks: inc.blocks, diff });
  }
  const allOk = rows.every((r) => r.ok);
  statusEl.innerHTML = allOk
    ? '<span class="pass">全部编辑步骤增量与全量一致</span>'
    : '<span class="fail">存在不一致步骤，增量实现禁止上线</span>';
  resultsEl.innerHTML = `<table><tr><th>编辑步骤</th><th>结论</th><th>块数(全量/增量)</th><th>首个差异</th></tr>`
    + rows.map((r) => `<tr><td>${r.name}</td><td class="${r.ok ? 'pass' : 'fail'}">${r.ok ? '一致' : '不一致'}</td>`
      + `<td>${r.fullBlocks} / ${r.incBlocks}</td>`
      + `<td>${r.diff ? `#${r.diff.i}<br>全量: ${escapeHtml(r.diff.A || '')}<br>增量: ${escapeHtml(r.diff.B || '')}` : '—'}</td></tr>`).join('')
    + '</table>';
  document.title = `dom-oracle ${allOk ? 'PASS' : 'FAIL'}`;
})();

function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])).slice(0, 260);
}
</script>
</body>
</html>
