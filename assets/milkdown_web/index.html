<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>Ushio Milkdown Bridge</title>
    <style>
      :root {
        --milkdown-color-primary: #4f46e5;
        --milkdown-color-on-primary: #ffffff;
        --milkdown-color-secondary: #64748b;
        --milkdown-color-on-secondary: #ffffff;
        --milkdown-color-surface: transparent;
        --milkdown-color-on-surface: #111827;
        --milkdown-color-background: transparent;
        --milkdown-color-on-background: #111827;
        --milkdown-color-error: #dc2626;
        --milkdown-color-on-error: #ffffff;
        --milkdown-color-outline: #cbd5e1;
        --milkdown-color-shadow: rgba(0, 0, 0, 0.12);
        --milkdown-font-body: "Noto Sans SC", sans-serif;
        --milkdown-font-mono: "JetBrains Mono", monospace;
        --milkdown-font-size: 16px;
        --milkdown-line-height: 1.7;
      }
      html,
      body,
      #app {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent !important;
        -webkit-touch-callout: none;
        -webkit-user-select: text;
        user-select: text;
      }
      #app {
        box-sizing: border-box;
        padding: 16px;
        color: var(--milkdown-color-on-surface);
        font-family: var(--milkdown-font-body);
        font-size: var(--milkdown-font-size);
        line-height: var(--milkdown-line-height);
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      (function () {
        const app = document.getElementById('app');
        let bridgeSeq = 0;
        let imageBaseUrl = null;

        const nextRequestId = () => `${Date.now()}-${++bridgeSeq}`;

        const postToFlutter = (msg) => {
          if (!window.flutter_inappwebview || !window.flutter_inappwebview.callHandler) {
            return;
          }
          window.flutter_inappwebview.callHandler('bridge', msg).catch((err) => {
            console.warn('bridge call failed', err);
          });
        };

        const cssVarMap = {
          primary: '--milkdown-color-primary',
          onPrimary: '--milkdown-color-on-primary',
          secondary: '--milkdown-color-secondary',
          onSecondary: '--milkdown-color-on-secondary',
          surface: '--milkdown-color-surface',
          onSurface: '--milkdown-color-on-surface',
          background: '--milkdown-color-background',
          onBackground: '--milkdown-color-on-background',
          error: '--milkdown-color-error',
          onError: '--milkdown-color-on-error',
          outline: '--milkdown-color-outline',
          shadow: '--milkdown-color-shadow'
        };

        const applyTheme = (payload) => {
          if (!payload || typeof payload !== 'object') return;
          const root = document.documentElement;
          if (payload.colors && typeof payload.colors === 'object') {
            Object.entries(payload.colors).forEach(([k, v]) => {
              const cssVar = cssVarMap[k];
              if (!cssVar || typeof v !== 'string') return;
              root.style.setProperty(cssVar, v);
            });
          }
          const font = payload.font;
          if (font && typeof font === 'object') {
            if (typeof font.body === 'string') {
              root.style.setProperty('--milkdown-font-body', font.body);
            }
            if (typeof font.mono === 'string') {
              root.style.setProperty('--milkdown-font-mono', font.mono);
            }
            if (typeof font.sizePx === 'number') {
              root.style.setProperty('--milkdown-font-size', `${font.sizePx}px`);
            }
            if (typeof font.lineHeight === 'number') {
              root.style.setProperty('--milkdown-line-height', `${font.lineHeight}`);
            }
          }
          if (payload.mode === 'light' || payload.mode === 'dark') {
            root.setAttribute('data-theme-mode', payload.mode);
          }
        };

        const emitOutlineUpdate = () => {
          const lines = (app.textContent || '').split('\n');
          const outline = [];
          lines.forEach((line, index) => {
            const match = line.match(/^(#{1,6})\s+(.+)$/);
            if (!match) return;
            outline.push({
              id: `line-${index}`,
              level: match[1].length,
              text: match[2].trim()
            });
          });
          postToFlutter({
            v: 1,
            source: 'web',
            target: 'flutter',
            type: 'on_outline_update',
            requestId: nextRequestId(),
            ts: Date.now(),
            payload: { outline }
          });
        };

        const emitContentAndOutline = () => {
          postToFlutter({
            v: 1,
            source: 'web',
            target: 'flutter',
            type: 'on_content_change',
            requestId: nextRequestId(),
            ts: Date.now(),
            payload: {
              mode: 'full',
              markdown: app.textContent
            }
          });
          emitOutlineUpdate();
        };

        const setMarkdown = (md) => {
          app.textContent = typeof md === 'string' ? md : '';
          emitContentAndOutline();
        };

        const applyInlineWrap = (prefix, suffix) => {
          const text = app.textContent || '';
          app.textContent = `${prefix}${text}${suffix}`;
          emitContentAndOutline();
        };

        const appendText = (text) => {
          app.textContent = `${app.textContent || ''}${text}`;
          emitContentAndOutline();
        };

        const normalizeImageSrc = (src) => {
          if (!src || typeof src !== 'string') return '';
          if (/^(https?:|file:|data:|content:)/i.test(src)) return src;
          if (!imageBaseUrl) return src;
          const base = imageBaseUrl.endsWith('/') ? imageBaseUrl : `${imageBaseUrl}/`;
          // Handle relative markdown image paths: "./a.png", "/a.png", "///a.png"
          // should all resolve to "<base>/a.png".
          return `${base}${src.replace(/^(\.\/|\/)+/, '')}`;
        };

        const isExternalHref = (href) => {
          if (typeof href !== 'string') return false;
          return /^(https?:|mailto:|tel:)/i.test(href);
        };

        const onFlutterMessage = (message) => {
          let m = message;
          if (typeof message === 'string') {
            try {
              m = JSON.parse(message);
            } catch (err) {
              console.warn('invalid flutter bridge message', err);
              return;
            }
          }
          if (!m || typeof m !== 'object') return;
          if (m.type === 'init_doc') {
            setMarkdown(m.payload && typeof m.payload.markdown === 'string' ? m.payload.markdown : '');
            return;
          }
          if (m.type === 'update_theme') {
            applyTheme(m.payload);
            return;
          }
          if (m.type === 'exec_cmd') {
            const cmd = m.payload && m.payload.cmd;
            if (cmd === 'focus_editor') {
              window.focus();
              return;
            }
            if (cmd === 'toggle_bold') {
              applyInlineWrap('**', '**');
              return;
            }
            if (cmd === 'toggle_italic') {
              applyInlineWrap('*', '*');
              return;
            }
            if (cmd === 'insert_table') {
              appendText('\n| Column 1 | Column 2 |\n| --- | --- |\n| Content 1 | Content 2 |\n');
              return;
            }
            if (cmd === 'insert_image') {
              const args = (m.payload && m.payload.args) || {};
              const src = normalizeImageSrc(typeof args.src === 'string' ? args.src : '');
              const alt = typeof args.alt === 'string' ? args.alt : 'image';
              if (src) appendText(`\n![${alt}](${src})\n`);
              return;
            }
            if (cmd === 'set_image_base') {
              const args = (m.payload && m.payload.args) || {};
              imageBaseUrl = typeof args.baseUrl === 'string' && args.baseUrl ? args.baseUrl : null;
              return;
            }
            if (cmd === 'undo' || cmd === 'redo') {
              console.info(`exec_cmd ${cmd} is not wired to editor history yet`);
              return;
            }
          }
        };

        window.__USHIO_BRIDGE__ = {
          postToFlutter,
          setMarkdown,
          exec: (payload) => onFlutterMessage({ type: 'exec_cmd', payload }),
          onFlutterMessage
        };

        document.addEventListener(
          'contextmenu',
          (e) => {
            e.preventDefault();
          },
          { passive: false }
        );

        document.addEventListener(
          'click',
          (e) => {
            let node = e.target;
            let hop = 0;
            while (
              node &&
              node !== document.body &&
              node !== document.documentElement &&
              hop < 64 &&
              (node.tagName || '').toUpperCase() !== 'A'
            ) {
              node = node.parentElement;
              hop += 1;
            }
            if (node && (node.tagName || '').toUpperCase() === 'A') {
              e.preventDefault();
              const href = node.getAttribute('href') || '';
              postToFlutter({
                v: 1,
                source: 'web',
                target: 'flutter',
                type: 'on_link_click',
                requestId: nextRequestId(),
                ts: Date.now(),
                payload: {
                  href,
                  text: node.textContent || '',
                  title: node.getAttribute('title') || '',
                  isExternal: isExternalHref(href)
                }
              });
            }
          },
          true
        );

        window.addEventListener('resize', () => {
          setTimeout(() => {
            const sel = window.getSelection();
            if (!sel || !sel.rangeCount) return;
            let node = null;
            if (sel.anchorNode instanceof Element) {
              node = sel.anchorNode;
            } else if (sel.anchorNode && sel.anchorNode.parentElement) {
              node = sel.anchorNode.parentElement;
            }
            node?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          }, 200);
        });
      })();
    </script>
  </body>
</html>
